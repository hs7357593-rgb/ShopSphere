spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vendora?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}
app.cors.origins=${CORS_ORIGINS:http://localhost:8080}
app.seed.password=${SEED_PASSWORD:}
